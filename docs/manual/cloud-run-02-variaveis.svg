<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Etapa 2: variaveis de ambiente do Cloud Run</title>
  <desc id="desc">Ilustracao do campo de variaveis de ambiente com AUTO_PUBLISHER_API_KEY.</desc>
  <rect width="1200" height="620" fill="#0b0f19"/>
  <rect x="40" y="35" width="1120" height="550" rx="18" fill="#111827" stroke="#374151"/>
  <text x="82" y="92" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="700">Cloud Run / Editar servico / Variaveis e segredos</text>
  <text x="82" y="145" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="19">Nome</text>
  <rect x="82" y="165" width="480" height="60" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="105" y="203" fill="#94a3b8" font-family="monospace" font-size="18">AUTO_PUBLISHER_API_KEY</text>
