  <rect x="82" y="270" width="180" height="52" rx="8" fill="#1e293b" stroke="#64748b"/><text x="119" y="303" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="17">+ Adicionar</text>
  <rect x="82" y="380" width="1036" height="82" rx="10" fill="#451a03" stroke="#f59e0b"/>
  <text x="108" y="413" fill="#fde68a" font-family="Arial, sans-serif" font-size="18" font-weight="700">Importante</text>
  <text x="108" y="442" fill="#fef3c7" font-family="Arial, sans-serif" font-size="17">Use exatamente o mesmo valor da Central de Chaves. Nao coloque a chave no codigo.</text>
  <rect x="82" y="500" width="230" height="58" rx="8" fill="#2563eb"/><text x="128" y="537" fill="white" font-family="Arial, sans-serif" font-size="19" font-weight="700">Implantar</text>
